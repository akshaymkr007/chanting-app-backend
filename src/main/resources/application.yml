server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain

spring:
  application:
    name: japa-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/japa_db}
    username: ${SPRING_DATASOURCE_USERNAME:japa_user}
    password: ${SPRING_DATASOURCE_PASSWORD:japa_secure_password_2026}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    drop-first: false

# Security / JWT configuration
app:
  jwt:
    secret: ${JWT_SECRET:4c616b73686d694e61726179616e615361637265644a6170614b657932303236456e6372797074}
    expiration-ms: 2592000000 # 30 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://ais-dev-oucinlptz5h63n7cc5vmzf-197691218597.asia-southeast1.run.app,https://ais-pre-oucinlptz5h63n7cc5vmzf-197691218597.asia-southeast1.run.app}

# Actuator metrics & probes for Kubernetes
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
