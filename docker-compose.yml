version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: japa-postgres
    environment:
      POSTGRES_DB: japa_db
      POSTGRES_USER: japa_user
      POSTGRES_PASSWORD: japa_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U japa_user -d japa_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  japa-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: japa-backend-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/japa_db
      SPRING_DATASOURCE_USERNAME: japa_user
      SPRING_DATASOURCE_PASSWORD: japa_secure_password_2026
      SPRING_PROFILES_ACTIVE: prod
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
